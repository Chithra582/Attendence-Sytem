name: qr-validator
description: Validate student check-in token and compute arrival timeliness.
input_schema:
  type: object
  properties:
    student_id:
      type: string
      description: Scanned student identification token.
    scan_timestamp:
      type: string
      description: ISO timestamp of the scan event.
    class_start_time:
      type: string
      description: Scheduled class start ISO timestamp.
  required:
    - student_id
    - scan_timestamp
    - class_start_time
